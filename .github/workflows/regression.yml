name: Regression (manual + nightly)

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to run (e.g. @smoke, @api, @regression)'
        required: true
        default: '@regression'
  schedule:
    - cron: '30 20 * * *'      # 20:30 UTC = 2:00 AM IST every day

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - run: npm ci
      - run: npx playwright install --with-deps chromium

      - name: Run tests for the chosen tag
        env:
          TAG: ${{ github.event.inputs.tag || '@regression' }}
        run: npx playwright test --grep "$TAG"

      - name: Upload HTML report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: regression-report
          path: playwright-report/